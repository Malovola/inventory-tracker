<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexTrack — Commercial Portal Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { font-family: 'Inter', sans-serif; }
        h1, h2, h3, h4, .brand-font { font-family: 'Outfit', sans-serif; }
        body {
            background: #0b1121;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
            overflow-x: hidden;
        }

        .bg-glow {
            position: fixed;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.15;
            pointer-events: none;
            z-index: 0;
        }
        .glow-1 { top: -100px; left: -100px; background: #3b82f6; }
        .glow-2 { bottom: -100px; right: -100px; background: #8b5cf6; }

        .glass-card {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.25rem;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6);
            width: 100%;
            max-width: 460px;
            position: relative;
            z-index: 10;
        }

        .input-field {
            width: 100%;
            padding: 0.75rem 1rem;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(148, 163, 184, 0.25);
            border-radius: 0.6rem;
            color: #f8fafc;
            transition: all 0.2s;
            outline: none;
            font-size: 0.925rem;
        }
        .input-field:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
        }

        .btn-primary {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            padding: 0.8rem 1.5rem;
            border-radius: 0.6rem;
            font-weight: 600;
            transition: all 0.2s;
            border: none;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.35);
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.45);
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .tab-btn {
            flex: 1;
            padding: 0.65rem 1rem;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 500;
            border-radius: 0.5rem;
            color: #94a3b8;
            transition: all 0.2s;
            cursor: pointer;
            border: none;
            background: transparent;
        }
        .tab-btn.active {
            background: #1e293b;
            color: #60a5fa;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .chip-btn {
            padding: 0.4rem 0.75rem;
            font-size: 0.75rem;
            border-radius: 0.5rem;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #cbd5e1;
            transition: all 0.15s;
            cursor: pointer;
            font-weight: 500;
        }
        .chip-btn:hover {
            background: rgba(59, 130, 246, 0.2);
            border-color: #3b82f6;
            color: #93c5fd;
        }
    </style>
</head>
<body>
    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>

    <div class="glass-card p-8">
        <!-- Logo & Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-br from-blue-500 to-indigo-600 font-bold text-2xl shadow-[0_0_20px_rgba(59,130,246,0.6)] brand-font mb-4">
                N
            </div>
            <h1 class="text-2xl font-bold tracking-wide text-white">NexTrack Enterprise</h1>
            <p class="text-sm text-slate-400 mt-1">Autonomous Commercial Inventory System</p>
        </div>

        <!-- Tab Switcher -->
        <div class="flex bg-slate-900/60 p-1 rounded-lg mb-6 border border-slate-700/50">
            <button type="button" id="tab-login" class="tab-btn active">Sign In</button>
            <button type="button" id="tab-register" class="tab-btn">Register Account</button>
        </div>

        <!-- Alert Notification -->
        <div id="alert-box" class="hidden p-3 rounded-lg text-sm mb-4"></div>

        <!-- Login Form -->
        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Work Email</label>
                <input id="login-email" type="email" required placeholder="name@store.com" class="input-field" value="admin@nextrack.com" />
            </div>
            <div>
                <div class="flex justify-between items-center mb-1.5">
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider">Password</label>
                </div>
                <input id="login-password" type="password" required placeholder="••••••••" class="input-field" value="admin123" />
            </div>

            <button type="submit" id="btn-login-submit" class="btn-primary mt-2">
                <span>Sign In to Dashboard</span>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
            </button>
        </form>

        <!-- Register Form -->
        <form id="register-form" class="hidden space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Full Name</label>
                <input id="reg-name" type="text" placeholder="Alex Rivera" class="input-field" />
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Email Address</label>
                <input id="reg-email" type="email" placeholder="alex@store.com" class="input-field" />
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Password</label>
                <input id="reg-password" type="password" minlength="6" placeholder="At least 6 characters" class="input-field" />
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">System Role</label>
                <select id="reg-role" class="input-field">
                    <option value="owner">Store Owner (Full Control & Analytics)</option>
                    <option value="manager">Store Manager (Inventory & Movements)</option>
                    <option value="cashier" selected>Cashier / Associate (Movements Only)</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Business / Store Name (Optional)</label>
                <input id="reg-biz" type="text" placeholder="e.g. Apex Convenience Store" class="input-field" />
            </div>

            <button type="submit" id="btn-reg-submit" class="btn-primary mt-2 !bg-purple-600 hover:!bg-purple-500">
                <span>Create Commercial Account</span>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path></svg>
            </button>
        </form>

        <!-- Quick Demo Accounts -->
        <div class="mt-6 pt-5 border-t border-slate-700/60">
            <div class="text-xs text-slate-400 font-medium mb-2.5">Demo Presets (Instant Fill):</div>
            <div class="flex flex-wrap gap-2">
                <button type="button" id="btn-preset-owner" class="chip-btn">
                    👑 Owner (admin)
                </button>
                <button type="button" id="btn-preset-manager" class="chip-btn">
                    💼 Manager
                </button>
                <button type="button" id="btn-preset-cashier" class="chip-btn">
                    🧑‍💼 Cashier
                </button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const tabLogin = document.getElementById('tab-login');
            const tabReg = document.getElementById('tab-register');
            const loginForm = document.getElementById('login-form');
            const regForm = document.getElementById('register-form');
            const alertBox = document.getElementById('alert-box');

            function showAlert(msg, isError = true) {
                alertBox.className = `p-3 rounded-lg text-sm mb-4 ${
                    isError
                        ? 'bg-red-500/15 border border-red-500/30 text-red-300'
                        : 'bg-emerald-500/15 border border-emerald-500/30 text-emerald-300'
                }`;
                alertBox.innerText = msg;
                alertBox.classList.remove('hidden');
            }

            function clearAlert() {
                alertBox.classList.add('hidden');
            }

            function switchTab(tab) {
                clearAlert();
                if (tab === 'login') {
                    loginForm.classList.remove('hidden');
                    regForm.classList.add('hidden');
                    tabLogin.classList.add('active');
                    tabReg.classList.remove('active');
                } else {
                    loginForm.classList.add('hidden');
                    regForm.classList.remove('hidden');
                    tabLogin.classList.remove('active');
                    tabReg.classList.add('active');
                }
            }

            function fillCredentials(email, pass) {
                switchTab('login');
                document.getElementById('login-email').value = email;
                document.getElementById('login-password').value = pass;
                clearAlert();
            }

            // Tab listeners
            tabLogin.addEventListener('click', () => switchTab('login'));
            tabReg.addEventListener('click', () => switchTab('register'));

            // Preset buttons
            document.getElementById('btn-preset-owner').addEventListener('click', () => {
                fillCredentials('admin@nextrack.com', 'admin123');
            });
            document.getElementById('btn-preset-manager').addEventListener('click', () => {
                fillCredentials('manager@nextrack.com', 'manager123');
            });
            document.getElementById('btn-preset-cashier').addEventListener('click', () => {
                fillCredentials('cashier@nextrack.com', 'cashier123');
            });

            // Login submit
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                clearAlert();

                const btn = document.getElementById('btn-login-submit');
                btn.disabled = true;
                btn.innerHTML = '<span>Verifying credentials...</span>';

                try {
                    const email = document.getElementById('login-email').value.trim();
                    const password = document.getElementById('login-password').value;

                    const res = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password }),
                    });

                    const data = await res.json();
                    if (!res.ok) {
                        showAlert(data.error || 'Authentication failed');
                        return;
                    }

                    localStorage.setItem('nextrack_token', data.token);
                    localStorage.setItem('nextrack_user', JSON.stringify(data.user));

                    showAlert('Login successful! Redirecting...', false);
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 500);
                } catch (err) {
                    showAlert('Network error: ' + err.message);
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = '<span>Sign In to Dashboard</span><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>';
                }
            });

            // Register submit
            regForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                clearAlert();

                const name = document.getElementById('reg-name').value.trim();
                const email = document.getElementById('reg-email').value.trim();
                const password = document.getElementById('reg-password').value;

                if (!name || !email || !password) {
                    showAlert('Please fill in all required fields (Name, Email, Password)');
                    return;
                }

                if (password.length < 6) {
                    showAlert('Password must be at least 6 characters');
                    return;
                }

                const btn = document.getElementById('btn-reg-submit');
                btn.disabled = true;
                btn.innerHTML = '<span>Creating account...</span>';

                try {
                    const payload = {
                        display_name: name,
                        email: email,
                        password: password,
                        role: document.getElementById('reg-role').value,
                        business_name: document.getElementById('reg-biz').value.trim() || undefined,
                    };

                    const res = await fetch('/api/auth/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload),
                    });

                    const data = await res.json();
                    if (!res.ok) {
                        const detail = data.details ? data.details.map((d) => d.message).join(', ') : data.error;
                        showAlert(detail || 'Registration failed');
                        return;
                    }

                    localStorage.setItem('nextrack_token', data.token);
                    localStorage.setItem('nextrack_user', JSON.stringify(data.user));

                    showAlert('Account created! Redirecting...', false);
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 500);
                } catch (err) {
                    showAlert('Network error: ' + err.message);
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = '<span>Create Commercial Account</span><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path></svg>';
                }
            });
        });
    </script>
</body>
</html>
