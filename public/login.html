<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NexTrack — Station Access</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/common.css" />
    <link rel="stylesheet" href="/css/login.css" />
    <script src="/js/i18n.js"></script>
  </head>
  <body
    class="bg-[#0b0f17] text-slate-200 min-h-screen flex flex-col justify-between select-none"
  >
    <!-- Top Bar: Physical Store Header -->
    <header
      class="h-12 border-b border-slate-800 px-6 flex items-center justify-between text-xs font-mono text-slate-400 bg-[#0e1422]"
    >
      <div class="flex items-center gap-3">
        <span class="font-bold text-white tracking-wider">NEXTRACK</span>
        <span class="text-slate-600">/</span>
        <span>STORE #01 · MAIN REGISTER</span>
      </div>
      <div class="flex items-center gap-4">
        <div id="language-switcher-container"></div>
        <span id="clock" class="text-slate-300">12:00:00</span>
        <span
          class="w-2 h-2 rounded-full bg-emerald-500"
          title="Database Connected"
        ></span>
      </div>
    </header>

    <!-- Main Workstation Interface -->
    <main class="flex-1 flex items-center justify-center p-4">
      <div class="w-full max-w-sm flex flex-col gap-6">
        <!-- Shift / Operator Identity -->
        <div class="text-center">
          <div
            class="inline-block px-2.5 py-0.5 rounded text-[11px] font-mono font-medium text-red-400 bg-blue-500/10 border border-blue-500/20 mb-2"
          >
            This is for test the system only.
          </div>
          <h1 class="text-lg font-bold text-white tracking-tight">
            Select Staff Account
          </h1>
          <p class="text-xs text-slate-400 mt-0.5">
            Tap operator card to authenticate
          </p>
        </div>

        <!-- Quick Operator Cards -->
        <div class="grid grid-cols-3 gap-2.5">
          <button
            type="button"
            data-email="admin@nextrack.com"
            data-pass="admin123"
            class="staff-card border-blue-500 bg-slate-800/80 p-3 rounded border hover:bg-slate-800 transition text-left flex flex-col justify-between h-20"
          >
            <span class="text-[10px] font-mono text-amber-400 font-semibold"
              >OWNER</span
            >
            <div>
              <div class="text-xs font-bold text-white">Admin</div>
              <div class="text-[10px] text-slate-400 font-mono">
                Full Access
              </div>
            </div>
          </button>

          <button
            type="button"
            data-email="manager@nextrack.com"
            data-pass="manager123"
            class="staff-card border-slate-800 bg-[#121927] p-3 rounded border hover:bg-slate-800 hover:border-blue-500 transition text-left flex flex-col justify-between h-20"
          >
            <span class="text-[10px] font-mono text-blue-400 font-semibold"
              >MGR</span
            >
            <div>
              <div class="text-xs font-bold text-white">Alex R.</div>
              <div class="text-[10px] text-slate-400 font-mono">Inventory</div>
            </div>
          </button>

          <button
            type="button"
            data-email="cashier@nextrack.com"
            data-pass="cashier123"
            class="staff-card border-slate-800 bg-[#121927] p-3 rounded border hover:bg-slate-800 hover:border-blue-500 transition text-left flex flex-col justify-between h-20"
          >
            <span class="text-[10px] font-mono text-emerald-400 font-semibold"
              >POS</span
            >
            <div>
              <div class="text-xs font-bold text-white">Staff 01</div>
              <div class="text-[10px] text-slate-400 font-mono">Counter</div>
            </div>
          </button>
        </div>

        <!-- Sign In Box (กะทัดรัด แบนราบ ไม่ลอยฟุ้ง) -->
        <div class="border border-slate-800 bg-[#101726] rounded p-5 space-y-4">
          <div
            id="alert-box"
            class="hidden p-2 rounded text-xs font-mono"
          ></div>

          <form id="login-form" class="space-y-3">
            <div>
              <label class="block text-[11px] font-mono text-slate-400 mb-1" data-i18n="login_email"
                >SELECTED OPERATOR</label
              >
              <input
                id="login-email"
                type="email"
                required
                readonly
                class="input-field !bg-slate-900/80 !border-slate-800 text-xs font-mono text-slate-300 cursor-not-allowed"
                value="admin@nextrack.com"
              />
            </div>

            <div>
              <label class="block text-[11px] font-mono text-slate-400 mb-1" data-i18n="login_password"
                >PASSWORD / PASSCODE</label
              >
              <input
                id="login-password"
                type="password"
                required
                class="input-field text-xs font-mono"
                value="admin123"
              />
            </div>

            <button
              type="submit"
              id="btn-login-submit"
              data-i18n="login_btn"
              class="btn-primary w-full py-2 text-xs font-semibold !bg-blue-600 hover:!bg-blue-500 rounded mt-1"
            >
              Unlock Register & Open Shift
            </button>
          </form>
        </div>
      </div>
    </main>

    <!-- Bottom Terminal Status Bar -->
    <footer
      class="h-8 border-t border-slate-800/80 px-6 flex items-center justify-between text-[11px] font-mono text-slate-500 bg-[#0a0e17]"
    >
      <span>DEVICE: LOCALHOST:3000</span>
      <span>ENCRYPTED SESSION</span>
    </footer>

    <script src="/js/login.js"></script>
  </body>
</html>
